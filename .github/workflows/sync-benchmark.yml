name: Sync benchmark (Linux)

# The sync benchmark (Benchmarks/sync/native.sh) on a Linux runner, for the
# commits in REFS, each pinned by its SHA: 1 and 3 workers, REPEATS runs
# each. Runs when a bench/ branch is pushed, or by hand. The tables are in
# the job summary and the runs are kept as an artifact.
on:
  push:
    branches: ["bench/**"]
  workflow_dispatch:
    inputs:
      refs:
        description: "Commits to compare, space separated"
        required: true
      repeats:
        description: "Runs per setting"
        default: "3"
      follower_cpus:
        description: "CPUs the follower is pinned to (taskset list), empty for none"
        default: "0"
      server_cpus:
        description: "CPUs the server is pinned to, empty for none"
        default: "1-3"
      workers:
        description: "Worker counts to run, space separated"
        default: "1"
      hosted:
        description: "Child levels the follower hosts (0: Nexus alone); empty for all"
        default: ""
      ratio:
        description: "One Nexus block every this many shares when recording (1: a Nexus-heavy chain); empty for the default"
        default: ""
      blocks:
        description: "Blocks to record (Alpha's height; with ratio 1, about Nexus's); empty for the default"
        default: ""

env:
  LATTICE_FORBID_DEFAULT_PEERS: "1"
  # Pushed runs compare the code before #137 (state buffer and write lane)
  # with main when the branch was cut.
  REFS: ${{ inputs.refs || 'c452703a 0c2feacd' }}
  REPEATS: ${{ inputs.repeats || '3' }}
  # Pushed runs pin the follower to one CPU and the server to the others:
  # the objective's target is per CPU.
  FOLLOWER_CPUS: ${{ inputs.follower_cpus || '0' }}
  SERVER_CPUS: ${{ inputs.server_cpus || '1-3' }}
  WORKER_COUNTS: ${{ inputs.workers || '1' }}
  # Optional: a follower hosting fewer levels, on a chain recorded with its
  # own ratio and length (its own dataset and run names, so a default run is
  # never mixed with it).
  HOSTED: ${{ inputs.hosted }}
  RATIO: ${{ inputs.ratio }}
  BLOCKS: ${{ inputs.blocks }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    container: swift:6.1-jammy
    timeout-minutes: 240
    steps:
      - name: Install dependencies for Linux
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates libsqlite3-dev procps python3 util-linux

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run the benchmark for each commit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "nproc: $(nproc); follower on CPUs '$FOLLOWER_CPUS', server on '$SERVER_CPUS'" | tee -a "$GITHUB_STEP_SUMMARY"
          for ref in $REFS; do
            sha=$(git rev-parse "$ref")
            for workers in $WORKER_COUNTS; do
              if [ -n "$HOSTED$RATIO$BLOCKS" ]; then
                label="h${HOSTED:-all}-r${RATIO:-34}-b${BLOCKS:-3000}"
                DATA="$RUNNER_TEMP/bench-$sha/data/$label" TAG="$label-w$workers" \
                  Benchmarks/sync/native.sh "$RUNNER_TEMP/bench-$sha" "$workers" "$REPEATS" "$sha"
              else
                Benchmarks/sync/native.sh "$RUNNER_TEMP/bench-$sha" "$workers" "$REPEATS" "$sha"
              fi
            done
          done

      - name: Report
        if: always()
        run: |
          {
            echo '## Sync benchmark on Linux'
            for ref in $REFS; do
              sha=$(git rev-parse "$ref")
              echo "### $ref ($sha)"
              python3 Benchmarks/sync/report.py "$RUNNER_TEMP"/bench-"$sha"/runs/* || true
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/out"
          for d in "$RUNNER_TEMP"/bench-*; do cp -r "$d/runs" "$RUNNER_TEMP/out/$(basename "$d")" 2>/dev/null || true; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-benchmark-linux
          path: ${{ runner.temp }}/out
